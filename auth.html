<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Portal - NexGen Earn</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* NexGen Special Styling */
        .auth-box {
            max-width: 420px;
            margin: 80px auto;
            text-align: center;
            padding: 40px;
            border: 1px solid rgba(0, 255, 136, 0.3); /* Neon Green Border */
        }
        .input-field {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(188, 19, 254, 0.5); /* Purple Border */
            border-radius: 12px;
            color: white;
            outline: none;
            transition: 0.3s;
        }
        .input-field:focus {
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }
        .toggle-link {
            cursor: pointer;
            color: #00ff88;
            font-size: 14px;
            text-decoration: underline;
        }
        .brand-name {
            color: #00ff88;
            font-weight: bold;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body style="background: #050505;">

    <div class="glass-card auth-box">
        <div class="brand-name">NexGen<span>Earn</span></div>
